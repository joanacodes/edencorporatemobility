# Génère le site (src/build.py) et le publie sur GitHub Pages à chaque push sur main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: cd src && python build.py
      # Plus tard, pour le blog Hugo (dossier blog/ à la racine du dépôt) :
      # - uses: peaceiris/actions-hugo@v3
      #   with: { hugo-version: "latest", extended: true }
      # - run: hugo -s blog -d ../dist/blog --baseURL https://edencorporatemobility.com/blog/ --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
